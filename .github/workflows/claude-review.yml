# Independent AI review of every PR: a reviewer that did not write the change
# reads it against the repo's rules. Claude Code loads CLAUDE.md (and
# server/CLAUDE.md, web/CLAUDE.md) from the checkout, so the review applies
# this project's rules, not generic advice; the "Reviewing" section of the root
# CLAUDE.md lists what to check here in particular.
#
# Runs Anthropic's code-review plugin through claude-code-action. Findings go
# on the PR as inline comments, or one summary comment when there are none.
# It reviews a PR once (it skips PRs that already carry its comment), skips
# drafts, and skips PRs it judges trivial. Ask again with @claude in a comment
# if claude.yml is installed.
#
# Setup (once): install the Claude GitHub App on the repo
# (https://github.com/apps/claude), then add the secret
# CLAUDE_CODE_OAUTH_TOKEN: run `claude setup-token` locally, which bills
# reviews to your Claude subscription. To use an API key instead, add
# ANTHROPIC_API_KEY and swap the auth line below. Without either secret
# (forks), the job skips with a notice.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review still running on the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The action rejects bot actors (it would fail on every Dependabot PR),
    # and drafts are not ready for review.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # GitHub App auth for posting the review
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - id: auth
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::Claude review skipped: the CLAUDE_CODE_OAUTH_TOKEN secret is not available to this run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.auth.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Needed even though the skill names the tool itself: the action only
          # starts the inline-comment server when --allowedTools lists it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
