<!doctype html>
<!-- lang is the shell's default, not a fixed fact: the server rewrites it per
     request for `?lang=en` and for a guest page in the other language
     (server/src/seo.ts). Ukrainian is the default because a bare `/` serves
     the Ukrainian landing page. -->
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b3592e" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The same Google Fonts URL that src/styles.css `@import`s, requested here
         as well and on purpose. The @import has to stay: the Claude Design sync
         renders styles.css as a standalone closure and would lose the families
         without it (.design-sync/NOTES.md). But an @import is only discovered
         *after* the stylesheet that contains it has been fetched and parsed, so
         on its own it serialises html -> css -> fonts.css -> font files and
         holds first paint for a round trip it did not need. A `<link>` here
         starts the same request while the app CSS is still downloading; the
         @import then resolves from cache and costs nothing. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Manrope:wght@400..800&amp;family=Marck+Script&amp;display=swap"
    />

    <!-- Everything between these markers is the Ukrainian landing page's head,
         and it is what the *server* replaces per path before sending the shell
         (server/src/seo.ts `replaceSeoBlock`). One document serves four
         screens, so these tags are right for exactly one of them; a share link
         must not unfurl as the marketing page, and an editor or a host's
         dashboard must not be indexed as one.

         Replaced rather than appended because `og:title` is first-one-wins in
         every unfurler that matters. Do not hand-edit: `server/test/seo.test.ts`
         pins this block to what the server generates for `/`. -->
